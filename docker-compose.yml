services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_connect_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_connect}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_connect_network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: campus_connect_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campus_connect}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      JWT_SECRET: ${JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:5500,http://localhost:5500}
      JWT_SIGNUP_PROOF_EXPIRY: ${JWT_SIGNUP_PROOF_EXPIRY:-15m}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      REQUIRE_EMAIL_OTP: ${REQUIRE_EMAIL_OTP:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_AUDIENCE_NAME: ${RESEND_AUDIENCE_NAME:-Campus Connect}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - campus_connect_network

volumes:
  postgres_data:

networks:
  campus_connect_network:
    driver: bridge
